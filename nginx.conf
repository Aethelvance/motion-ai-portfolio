# Rate limit zone: 10 MB state (enough for ~160k unique IPs), 10 requests per
# minute per client IP. The 1m rate is the long-term ceiling; per-request bursts
# are bounded by `burst=5 nodelay` inside the location block.
limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/m;
# 429 instead of the default 503 so the client can back off using the same
# semantic it already handles for upstream rate limits (plan 1.4).
limit_req_status 429;

server {
    listen ${NGINX_PORT};
    listen [::]:${NGINX_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Issue relative redirects only. Default nginx behavior for $uri/ fallback is
    # absolute (Location: http://server:port/path), which leaks the internal listen
    # port (e.g. 4321) into the browser URL bar. With this off, the browser resolves
    # the redirect against the host it already used, so the port disappears.
    absolute_redirect off;

    # Security headers for all responses (static and proxied)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS: only enable behind a TLS-terminating proxy (Dokploy/Traefik) that strips/adds this header
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cap request body size at the proxy level so oversized requests are rejected
    # BEFORE hitting the api. Should match api MAX_BODY_BYTES (default 1 MiB).
    client_max_body_size 1m;

    # plan 5.4: edge caching. Hashed assets are fingerprinted (immutable);
    # HTML pages must revalidate so a deploy with a new index.html is picked up
    # immediately. The browser still benefits from the revalidation round-trip
    # being a 304 instead of a full download when content is unchanged.
    location /_astro/ {
        # `expires 1y` sets the Expires header to one year out. The matching
        # add_header below sets the modern Cache-Control (Expires is legacy
        # but some clients still key off it).
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Static files (Astro build output). HTML and any other content is
    # served with no-cache so the user always sees the latest index.html
    # after a deploy. _astro/ matches above and takes precedence.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # Serve uploaded images from the api directly. Matched BEFORE the generic
    # /api/ block so this location wins for /api/chat/upload/*. Static GETs
    # should not be subject to the chat rate limiter; the api has its own size
    # cap (8 MiB at upload time) and the immutable Cache-Control lets the
    # browser skip the round-trip on repeat views.
    location /api/chat/upload/ {
        proxy_pass http://api:${NGINX_API_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Proxy API requests to the api service. The api service is on the internal docker network.
    # Notes:
    # - timeout 60s: LLM responses can be slow on first token
    # - keep-alive: reuse connection to api container
    # - limit_req: 10r/m per client IP, burst of 5 served immediately, then 429
    #   with Retry-After so well-behaved clients back off cleanly
    # - gzip_min_length 0: chat replies are 200-500 bytes; the global default of
    #   1024 would skip them. The latency win on slow mobile links is the point
    #   of plan 2.6 even though the byte savings are small.
    # - Cache-Control: no-store: chat history and telemetry must never be
    #   cached by intermediaries (CDN, browser back/forward, etc.). The api's
    #   own thread IDs and per-request state would leak otherwise.
    location /api/ {
        limit_req zone=chat burst=5 nodelay;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        gzip_min_length 0;

        proxy_pass http://api:${NGINX_API_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;
}
