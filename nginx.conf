server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for all responses (static and proxied)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS: only enable behind a TLS-terminating proxy (Dokploy/Traefik) that strips/adds this header
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cap request body size at the proxy level so oversized requests are rejected
    # BEFORE hitting the api. Should match api MAX_BODY_BYTES (default 1 MiB).
    client_max_body_size 1m;

    # Static files (Astro build output)
    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy API requests to the api service. The api service is on the internal docker network.
    # Notes:
    # - timeout 60s: LLM responses can be slow on first token
    # - keep-alive: reuse connection to api container
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;
}
